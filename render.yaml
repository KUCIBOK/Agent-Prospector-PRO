services:
  - type: web
    name: kucibok-prospector
    runtime: python311
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kucibok-db
          property: connectionString
    plan: free

databases:
  - name: kucibok-db
    databaseName: kucibok_prospector
    user: kucibok_user
    plan: free
